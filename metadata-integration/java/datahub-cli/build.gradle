plugins {
    id "application"
}
apply plugin: 'java'

// The shaded jar is a release artifact, not an everyday one. Applying the shadow plugin wires
// shadowJar into `assemble`, and every build then repacks ~47 MB: measured 8.6s against 2.4s for
// the plain jar + lib/ layout. Unwiring it from `assemble` afterwards does not work -- the plugin
// also registers it as an archive artifact -- so the plugin itself is opt-in:
//
//   ./gradlew :metadata-integration:java:datahub-cli:shadowJar -PwithShadowJar
def withShadowJar = project.hasProperty('withShadowJar')
if (withShadowJar) {
    apply plugin: 'com.gradleup.shadow'
}

ext {
    javaMainClass = "io.datahubproject.cli.DataHubCli"
}

application {
    mainClass = javaMainClass
    applicationName = 'datahub-cli'
    // JLine's FFM terminal provider calls restricted native methods; without this the JVM prints a
    // warning on every run and will refuse the call outright in a future release.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    implementation 'info.picocli:picocli:4.7.5'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.5'

    // Interactive shell. The root build pins org.jline to jlineVersion for CVE fixes, so the glue
    // in ShellCommand is written against the JLine API directly rather than via picocli-shell-jline3
    // (which targets the JLine 3.x line).
    implementation "org.jline:jline:${rootProject.ext.jlineVersion}"

    // Offline entity registry, used only for TAB completion of entity and aspect names. It brings
    // metadata-models and the pegasus runtime with it, which is most of the shaded jar's size.
    implementation project(':entity-registry')

    // Only for PoliciesConfig, the catalogue of privilege names and descriptions. Its transitive
    // closure is the whole server stack (measured: 361 jars, 221 MB), while the class itself needs
    // just pegasus, guava and the policy models, which entity-registry above already brings.
    implementation(project(':metadata-utils')) { transitive = false }

    // HTTP is java.net.http (JDK); Jackson covers both the GraphQL payloads and the YAML config.
    implementation platform(externalDependency.jacksonBom)
    implementation externalDependency.jacksonDataBind
    implementation externalDependency.jacksonDataFormatYaml

    testImplementation externalDependency.testng
}

if (withShadowJar) {
    // The shaded jar takes the plain name; the thin jar steps aside so the two do not collide.
    jar {
        archiveClassifier = 'lib'
    }

    // A single portable jar: build/libs/datahub-cli.jar, runnable with `java -jar` on any host with
    // a matching JDK and no lib/ directory next to it.
    shadowJar {
        archiveClassifier = ''
        // JLine discovers its terminal providers through ServiceLoader; without merged service
        // files the shaded jar falls back to a dumb terminal and loses line editing.
        mergeServiceFiles()
        manifest {
            attributes 'Main-Class': javaMainClass
            // Same reason as applicationDefaultJvmArgs above, for `java -jar` with no flags.
            attributes 'Enable-Native-Access': 'ALL-UNNAMED'
        }
    }
}

// Archives nothing here consumes: installDist already gives the jar + lib/ layout, and the shaded
// distribution would be that layout with an already-fat jar inside it.
tasks.matching { it.name in ['distTar', 'distZip', 'shadowDistTar', 'shadowDistZip'] }
        .configureEach { enabled = false }

test {
    useTestNG()
}
