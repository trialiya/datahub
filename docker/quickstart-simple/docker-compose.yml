---
# Self-contained DataHub quickstart stack for local runs.
#
# Goal: set ONE thing — the image version/tag — in .env (DATAHUB_VERSION) and run:
#
#     docker compose up -d
#
# This brings up the standard quickstart topology (MySQL + OpenSearch + Kafka,
# GMS + Frontend + Actions). Unlike ../profiles/docker-compose.yml it uses no
# Compose profiles, so a plain `up` starts everything. It reuses the canonical
# per-service env files under ../profiles/<service>/env/docker.env and only
# overrides what the quickstart topology requires.
#
# UI: http://localhost:9002  (default login datahub / datahub)
name: datahub

#################################
# Shared environment fragments
#################################
x-primary-datastore-mysql-env: &primary-datastore-mysql-env
  EBEAN_DATASOURCE_USERNAME: ${DATAHUB_EBEAN_DATASOURCE_ROOT_USERNAME:-root}
  EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_EBEAN_DATASOURCE_ROOT_PASSWORD:-datahub}
  EBEAN_DATASOURCE_HOST: mysql:3306
  EBEAN_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2'
  EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver

x-search-datastore-env: &search-datastore-env
  ELASTICSEARCH_HOST: search
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: ${ELASTICSEARCH_USE_SSL:-false}
  ELASTICSEARCH_IMPLEMENTATION: opensearch
  # Use Elasticsearch (not Neo4j) as the graph store for the quickstart topology.
  GRAPH_SERVICE_IMPL: elasticsearch

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVER: broker:29092
  SCHEMA_REGISTRY_TYPE: INTERNAL
  KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/

x-datahub-common-env: &datahub-common-env
  DATAHUB_TELEMETRY_ENABLED: ${DATAHUB_TELEMETRY_ENABLED:-true}
  DATAHUB_SERVER_TYPE: ${DATAHUB_SERVER_TYPE:-quickstart}

services:
  #################################
  # Storage / infra
  #################################
  mysql:
    hostname: mysql
    image: mysql:${DATAHUB_MYSQL_VERSION:-8.2}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --default-authentication-plugin=caching_sha2_password
    ports:
      - ${DATAHUB_MAPPED_MYSQL_PORT:-3306}:3306
    env_file: ../profiles/mysql/env/docker.env
    restart: on-failure
    healthcheck:
      test: mysqladmin ping -h mysql -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 20s
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - mysqldata:/var/lib/mysql

  opensearch:
    hostname: search
    image: ${DATAHUB_SEARCH_IMAGE:-opensearchproject/opensearch}:${DATAHUB_SEARCH_TAG:-2.19.3}
    ports:
      - ${DATAHUB_MAPPED_ELASTIC_PORT:-9200}:9200
    env_file: ../profiles/elasticsearch/env/docker.env
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: curl -sS --fail http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s
      start_period: 60s
      interval: 5s
      retries: 10
      timeout: 15s
    volumes:
      - osdata:/usr/share/opensearch/data

  kafka-broker:
    hostname: broker
    image: ${DATAHUB_CONFLUENT_KAFKA_IMAGE:-confluentinc/cp-kafka}:${DATAHUB_CONFLUENT_VERSION:-8.0.0}
    command:
      - /bin/bash
      - -c
      - |
        # Generate KRaft clusterID
        file_path="/var/lib/kafka/data/clusterID"

        if [ ! -f "$$file_path" ]; then
           /bin/kafka-storage random-uuid > $$file_path
           echo "Cluster id has been created..."
           # KRaft required step: Format the storage directory with a new cluster ID
           kafka-storage format --ignore-formatted -t $$(cat "$$file_path") -c /etc/kafka/kafka.properties
        fi

        export CLUSTER_ID=$$(cat "$$file_path")
        echo "CLUSTER_ID=$$CLUSTER_ID"

        /etc/confluent/docker/run
    ports:
      - ${DATAHUB_MAPPED_KAFKA_BROKER_PORT:-9092}:9092
    env_file: ../profiles/kafka-broker/env/docker.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: BROKER://broker:29092,EXTERNAL://broker:9092,CONTROLLER://broker:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:39092
      KAFKA_LOG4J_LOGGERS: 'org.apache.kafka.image.loader.MetadataLoader=WARN'
      KAFKA_ZOOKEEPER_CONNECT: null
    healthcheck:
      test: nc -z broker 9092
      start_period: 60s
      interval: 1s
      retries: 5
      timeout: 5s
    volumes:
      - broker:/var/lib/kafka/data/

  #################################
  # DataHub
  #################################
  # One-shot job: initializes the SQL schema and builds the search indices,
  # then exits. Everything else waits for it to complete successfully.
  datahub-system-update:
    hostname: datahub-system-update
    image: ${DATAHUB_UPGRADE_IMAGE:-${DATAHUB_REPO:-acryldata}/datahub-upgrade}:${DATAHUB_VERSION:-head}
    command: ["-u", "SystemUpdate"]
    env_file: ../profiles/datahub-upgrade/env/docker.env
    environment:
      <<: [*primary-datastore-mysql-env, *search-datastore-env, *kafka-env, *datahub-common-env]
      DATAHUB_SQL_SETUP_ENABLED: ${DATAHUB_SQL_SETUP_ENABLED:-true}
      SCHEMA_REGISTRY_SYSTEM_UPDATE: 'true'
      USE_CONFLUENT_SCHEMA_REGISTRY: 'false'
      DATAHUB_PRECREATE_TOPICS: ${DATAHUB_PRECREATE_TOPICS:-true}
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy

  datahub-gms:
    hostname: datahub-gms
    image: ${DATAHUB_GMS_IMAGE:-${DATAHUB_REPO:-acryldata}/datahub-gms}:${DATAHUB_VERSION:-head}
    ports:
      - ${DATAHUB_MAPPED_GMS_PORT:-8080}:8080
    env_file: ../profiles/datahub-gms/env/docker.env
    environment:
      <<: [*primary-datastore-mysql-env, *search-datastore-env, *kafka-env, *datahub-common-env]
      THEME_V2_DEFAULT: ${THEME_V2_DEFAULT:-true}
      METADATA_SERVICE_AUTH_ENABLED: ${METADATA_SERVICE_AUTH_ENABLED:-true}
    healthcheck:
      test: curl -sS --fail http://datahub-gms:8080/health
      start_period: 90s
      interval: 1s
      retries: 3
      timeout: 5s
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully

  datahub-frontend-react:
    hostname: datahub-frontend-react
    image: ${DATAHUB_FRONTEND_IMAGE:-${DATAHUB_REPO:-acryldata}/datahub-frontend-react}:${DATAHUB_VERSION:-head}
    ports:
      - ${DATAHUB_MAPPED_FRONTEND_PORT:-9002}:9002
    env_file: ../profiles/datahub-frontend/env/docker.env
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
      # Play maps this to play.http.secret.key; HS256 needs >=256 bits.
      # Override with a long random value for anything beyond local use.
      DATAHUB_SECRET: ${DATAHUB_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      THEME_V2_DEFAULT: ${THEME_V2_DEFAULT:-true}
    depends_on:
      datahub-gms:
        condition: service_healthy

  datahub-actions:
    hostname: actions
    image: ${DATAHUB_ACTIONS_IMAGE:-${DATAHUB_REPO:-acryldata}/datahub-actions}:${DATAHUB_ACTIONS_VERSION:-${DATAHUB_VERSION:-head}}-slim
    env_file: ../profiles/datahub-actions/env/docker.env
    environment:
      <<: *search-datastore-env
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      SCHEMA_REGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
    depends_on:
      datahub-gms:
        condition: service_healthy

networks:
  default:
    name: datahub_network

volumes:
  osdata:
  broker:
  mysqldata:
